# Demo stub Deployment so `helm template` renders something for mimir-distributed.
# In production this directory is replaced with the upstream mimir-distributed chart's templates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir-distributed-demo
  labels:
    app.kubernetes.io/name: mimir-distributed
    app.kubernetes.io/component: demo-stub
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir-distributed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir-distributed
    spec:
      containers:
        - name: mimir-distributed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
