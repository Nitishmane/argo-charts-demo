{{- if not (has "loki" .Values.applicationBlacklist) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argoProject }}
  destination:
    namespace: loki
    server: {{ .Values.server }}
  source:
    path: loki
    repoURL: {{ .Values.argoRepo }}
    targetRevision: {{ .Values.argoRepoBranch }}
    project: {{ .Values.argoProject }}
    helm:
      valueFiles:
        - values.yaml
      values: |
        loki:
          storage:
            type: s3
            bucketNames:
              chunks: acme-loki-{{ .Values.region_string }}-demo   # TODO: replace with your bucket
              ruler:  acme-loki-{{ .Values.region_string }}-demo   # TODO: replace with your bucket
              admin:  acme-loki-{{ .Values.region_string }}-demo   # TODO: replace with your bucket
            s3:
              region: {{ .Values.region }}
              endpoint: s3.{{ .Values.region }}.amazonaws.com
              insecure: false
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h
        deploymentMode: SimpleScalable
        backend:
          replicas: 3
        read:
          replicas: 3
        write:
          replicas: 3
        singleBinary:
          replicas: 0
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
