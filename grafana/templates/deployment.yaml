# Demo stub Deployment so `helm template` renders something for grafana.
# In production this directory is replaced with the upstream grafana chart's templates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-demo
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: demo-stub
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
