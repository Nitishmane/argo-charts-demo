# Demo stub Deployment so `helm template` renders something for opentelemetry-demo.
# In production this directory is replaced with the upstream opentelemetry-demo chart's templates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-demo
  labels:
    app.kubernetes.io/name: opentelemetry-demo
    app.kubernetes.io/component: demo-stub
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentelemetry-demo
    spec:
      containers:
        - name: opentelemetry-demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
