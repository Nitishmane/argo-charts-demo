# Demo stub Deployment so `helm template` renders something for loki.
# In production this directory is replaced with the upstream loki chart's templates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-demo
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: demo-stub
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      containers:
        - name: loki
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
