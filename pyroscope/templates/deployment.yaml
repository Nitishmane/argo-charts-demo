# Demo stub Deployment so `helm template` renders something for pyroscope.
# In production this directory is replaced with the upstream pyroscope chart's templates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope-demo
  labels:
    app.kubernetes.io/name: pyroscope
    app.kubernetes.io/component: demo-stub
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pyroscope
    spec:
      containers:
        - name: pyroscope
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
