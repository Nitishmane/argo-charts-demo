# Demo stub Deployment so `helm template` renders something for tempo-distributed.
# In production this directory is replaced with the upstream tempo-distributed chart's templates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-distributed-demo
  labels:
    app.kubernetes.io/name: tempo-distributed
    app.kubernetes.io/component: demo-stub
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo-distributed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo-distributed
    spec:
      containers:
        - name: tempo-distributed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
